<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Main flow pane</title>
<style>
  :root {
    --page: #141413;
    --pane: #1f1f1e;
    --line: #34332f;
    --field: #2a2a28;
    --text: #ecebe6;
    --dim: #9d9b94;
    --accent: #d97757;
    --on-accent: #1f1f1e;
    --mono: "SF Mono", Menlo, "DejaVu Sans Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  ::selection { background: #d9775766; }
  body {
    background: var(--page);
    color: var(--text);
    font: 14px/1.45 Inter, system-ui, sans-serif;
    padding: 24px 16px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }
  figure { display: flex; flex-direction: column; gap: 10px; }
  figcaption { color: var(--dim); font-size: 12px; max-width: 252px; }

  .pane {
    width: 252px;
    background: var(--pane);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 12px; border-bottom: 1px solid var(--line);
    color: var(--dim); font-size: 13px;
  }
  .bar span:last-child { letter-spacing: 4px; }
  .body { padding: 12px; display: flex; flex-direction: column; gap: 12px; }

  .head { display: flex; gap: 8px; }
  .select, .btn-quiet-box {
    height: 34px; border: 1px solid var(--line); border-radius: 7px;
    background: var(--field); display: flex; align-items: center;
  }
  .select { flex: 1; padding: 0 10px; justify-content: space-between; }
  .select::after { content: "⌄"; color: var(--dim); transform: translateY(-3px); }
  .btn-quiet-box { padding: 0 10px; color: var(--dim); background: transparent; }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { color: var(--dim); font-size: 12px; }
  .input {
    height: 32px; padding: 0 10px; border-radius: 7px;
    background: var(--field); border: 1px solid var(--line);
    display: flex; align-items: center;
  }
  .input.empty { color: var(--dim); }

  .card { display: flex; flex-direction: column; gap: 8px; }
  .title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .title h2 { font-size: 16px; font-weight: 650; line-height: 1.25; }
  .meta { color: var(--dim); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .sub { color: var(--dim); font-size: 12px; margin-top: -4px; font-variant-numeric: tabular-nums; }
  code {
    display: block; font: 12.5px/1.5 var(--mono); padding: 8px 10px;
    background: var(--field); border-radius: 7px; overflow-wrap: anywhere;
  }
  .hint { color: var(--dim); font-size: 13px; }
  .primary {
    height: 36px; border-radius: 7px; background: var(--accent); color: var(--on-accent);
    font-weight: 650; display: flex; align-items: center; justify-content: center;
  }
  .quiet { color: var(--dim); font-size: 13px; }

  .progress { height: 4px; border-radius: 2px; background: #8080804d; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }

  ul { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 3px; }
  li { display: flex; gap: 10px; align-items: baseline; }
  li b { width: 14px; text-align: center; font-weight: 400; flex: none; }
  li.done, li.skipped { color: var(--dim); }
  li.skipped span { text-decoration: line-through; }
  li.current { color: var(--accent); font-weight: 600; }
  li.current span { color: var(--text); }
  li .count { margin-left: auto; color: var(--dim); font-size: 12px; font-weight: 400; font-variant-numeric: tabular-nums; }
  li.opt { color: var(--dim); font-size: 12px; padding-left: 24px; }
  li.ticket { padding-left: 24px; font-size: 13px; }
  li.ticket b { width: 12px; }
  li.ticket .num { color: var(--dim); font-variant-numeric: tabular-nums; }
  li.ticket.done span { color: var(--dim); }
  li.ticket.current span { font-weight: 600; }

  .about { display: flex; flex-direction: column; gap: 2px; }
  .about strong { font-weight: 600; }
  .about p { color: var(--dim); font-size: 13px; }
  .confirm {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 12.5px; color: var(--dim);
  }
  .confirm .actions { display: flex; gap: 6px; }
  .confirm .actions span { padding: 3px 9px; border: 1px solid var(--line); border-radius: 6px; color: var(--text); }
  .confirm .actions span:first-child { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<div class="row">

  <!-- 1. Start: no flow chosen -->
  <figure id="start">
    <div class="pane">
      <div class="bar"><span>Main flow</span><span>⤢✕</span></div>
      <div class="body">
        <div class="head"><div class="select" style="color:var(--dim)">Choose a flow</div><div class="btn-quiet-box">Reset</div></div>
        <div class="about"><strong>Full</strong><p>Builds that span sessions: spec, tickets, one /implement per ticket.</p></div>
        <div class="about"><strong>Quick</strong><p>Fits one session: spec, then implement straight away.</p></div>
        <div class="card">
          <div class="title"><h2>Grill</h2><span class="meta">Start here</span></div>
          <code>/grill-with-docs</code>
          <p class="hint">Get interviewed about the plan. Running it picks Full; switch any time.</p>
          <div class="primary">Copy command</div>
        </div>
      </div>
    </div>
    <figcaption>Mockup. No flow chosen yet.</figcaption>
  </figure>

  <!-- 2. Full flow, implementing ticket 3 of 8 -->
  <figure id="implement">
    <div class="pane">
      <div class="bar"><span>Main flow</span><span>⤢✕</span></div>
      <div class="body">
        <div class="head"><div class="select">Full</div><div class="btn-quiet-box">Reset</div></div>
        <div class="field"><label>Feature</label><div class="input">checkout</div></div>
        <div class="card">
          <h2 class="title"><span style="font-size:16px;font-weight:650">03 Pay button</span></h2>
          <p class="sub">Implement · ticket 3 of 8</p>
          <code>/implement .scratch/checkout/issues/03-pay-button.md</code>
          <p class="hint">Run /clear first: each ticket starts fresh.</p>
          <div class="primary">Copy command</div>
          <span class="quiet">Skip ticket</span>
        </div>
        <div class="progress"><i style="width:56%"></i></div>
        <ul>
          <li class="done"><b>✓</b><span>Grill</span></li>
          <li class="opt">+ Optional: prototype</li>
          <li class="done"><b>✓</b><span>Spec</span></li>
          <li class="done"><b>✓</b><span>Tickets</span></li>
          <li class="current"><b>●</b><span>Implement</span><span class="count">2 of 8 done</span></li>
          <li class="ticket done"><b>✓</b><span><span class="num">01</span> Cart model</span></li>
          <li class="ticket done"><b>✓</b><span><span class="num">02</span> Cart API</span></li>
          <li class="ticket current"><b>●</b><span><span class="num">03</span> Pay button</span></li>
          <li class="ticket"><b>○</b><span><span class="num">04</span> Receipt email</span></li>
          <li class="ticket"><b>○</b><span><span class="num">05</span> Refunds</span></li>
          <li class="ticket"><b>○</b><span><span class="num">06</span> Order history</span></li>
          <li class="ticket"><b>○</b><span><span class="num">07</span> Promo codes</span></li>
          <li class="ticket"><b>○</b><span><span class="num">08</span> Checkout analytics</span></li>
          <li><b>○</b><span>Review</span></li>
          <li><b>○</b><span>Retro</span></li>
        </ul>
      </div>
    </div>
    <figcaption>Mockup. Full flow, building ticket 3. Tap a ticket row to mark it done or undone.</figcaption>
  </figure>

  <!-- 3. Quick flow, review next, with Base field -->
  <figure id="review">
    <div class="pane">
      <div class="bar"><span>Main flow</span><span>⤢✕</span></div>
      <div class="body">
        <div class="head"><div class="select">Quick</div><div class="btn-quiet-box">Reset</div></div>
        <div class="field"><label>Feature</label><div class="input">dark-mode</div></div>
        <div class="card">
          <div class="title"><h2>Review</h2><span class="meta">Step 4 of 5</span></div>
          <div class="field"><label>Base</label><div class="input">main</div></div>
          <code>/code-review main</code>
          <p class="hint">Check the diff against the repo's standards and the spec.</p>
          <div class="primary">Copy command</div>
          <span class="quiet">Skip step</span>
        </div>
        <div class="progress"><i style="width:60%"></i></div>
        <ul>
          <li class="done"><b>✓</b><span>Grill</span></li>
          <li class="opt">+ Optional: ✓ prototype</li>
          <li class="done"><b>✓</b><span>Spec</span></li>
          <li class="done"><b>✓</b><span>Implement</span></li>
          <li class="current"><b>●</b><span>Review</span></li>
          <li><b>○</b><span>Retro</span></li>
        </ul>
      </div>
    </div>
    <figcaption>Mockup. Quick flow at review. The Base field appears only here.</figcaption>
  </figure>

  <!-- 4. Feature change confirm -->
  <figure id="confirm">
    <div class="pane">
      <div class="bar"><span>Main flow</span><span>⤢✕</span></div>
      <div class="body">
        <div class="head"><div class="select">Full</div><div class="btn-quiet-box">Reset</div></div>
        <div class="field"><label>Feature</label><div class="input">search</div></div>
        <div class="confirm"><span>New feature clears progress.</span><span class="actions"><span>Clear</span><span>Keep</span></span></div>
        <div class="card">
          <div class="title"><h2>Tickets</h2><span class="meta">Step 3 of 6</span></div>
          <code>/to-tickets</code>
          <p class="hint">Split the spec into tickets. Stay in this context window until it's done.</p>
          <div class="primary">Copy command</div>
          <span class="quiet">Skip step</span>
        </div>
        <div class="progress"><i style="width:33%"></i></div>
        <ul>
          <li class="done"><b>✓</b><span>Grill</span></li>
          <li class="opt">+ Optional: prototype</li>
          <li class="done"><b>✓</b><span>Spec</span></li>
          <li class="current"><b>●</b><span>Tickets</span></li>
          <li><b>○</b><span>Implement</span></li>
          <li><b>○</b><span>Review</span></li>
          <li><b>○</b><span>Retro</span></li>
        </ul>
      </div>
    </div>
    <figcaption>Mockup. Editing Feature mid-flow asks before clearing progress.</figcaption>
  </figure>

  <!-- 5. Flow complete -->
  <figure id="complete">
    <div class="pane">
      <div class="bar"><span>Main flow</span><span>⤢✕</span></div>
      <div class="body">
        <div class="head"><div class="select">Full</div><div class="btn-quiet-box">Reset</div></div>
        <div class="field"><label>Feature</label><div class="input">checkout</div></div>
        <div class="card">
          <h2 style="font-size:16px;font-weight:650">Flow complete</h2>
          <p class="hint">Shipped. Start again for the next feature.</p>
          <div class="primary">Start again</div>
        </div>
        <div class="progress"><i style="width:100%"></i></div>
        <ul>
          <li class="done"><b>✓</b><span>Grill</span></li>
          <li class="opt">+ Optional: prototype</li>
          <li class="done"><b>✓</b><span>Spec</span></li>
          <li class="done"><b>✓</b><span>Tickets</span></li>
          <li class="done"><b>✓</b><span>Implement</span><span class="count">8 of 8 done</span></li>
          <li class="done"><b>✓</b><span>Review</span></li>
          <li class="done"><b>✓</b><span>Retro</span></li>
        </ul>
      </div>
    </div>
    <figcaption>Mockup. Done; Start again keeps the feature name.</figcaption>
  </figure>

</div>
</body>
</html>
